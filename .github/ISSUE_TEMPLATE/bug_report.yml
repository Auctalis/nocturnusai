name: Bug Report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.

  - type: input
    id: version
    attributes:
      label: NocturnusAI version
      description: Run `curl http://localhost:9300/health` and paste the output, or give the Docker tag / git SHA
      placeholder: "e.g. 0.1.0 or ghcr.io/auctalis/nocturnusai:0.1.0"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How are you running NocturnusAI?
      options:
        - Docker (docker compose up)
        - Docker (docker run)
        - From source (./gradlew run)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal curl commands or code to reproduce the issue
      placeholder: |
        curl -X POST http://localhost:9300/tell ...
        curl -X POST http://localhost:9300/ask ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include the full response body and any error messages.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: OS, Java version, Docker version, relevant env vars (redact secrets)
