name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Kotlin: build + test on JDK 17 and 21 ──────────────────────────────────
  test-kotlin:
    name: Kotlin (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        run: ./gradlew build test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: "**/build/reports/tests/"
          retention-days: 7

  # ── Python SDK ──────────────────────────────────────────────────────────────
  test-python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml

      - name: Install SDK with dev dependencies
        working-directory: sdks/python
        run: pip install -e ".[langchain,dev]"

      - name: Lint (ruff)
        working-directory: sdks/python
        run: ruff check .

      - name: Type check (mypy)
        working-directory: sdks/python
        run: mypy nocturnusai/

      - name: Test (pytest)
        working-directory: sdks/python
        run: pytest -v --tb=short || test $? -eq 5

  # ── TypeScript SDK ──────────────────────────────────────────────────────────
  test-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdks/typescript
        run: npm ci

      - name: Build (type-check)
        working-directory: sdks/typescript
        run: npm run build

  # ── Security: Trivy vulnerability scan ─────────────────────────────────────
  security:
    name: Security (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          scanners: "vuln,secret"
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  # ── Docs site ───────────────────────────────────────────────────────────────
  build-site:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
