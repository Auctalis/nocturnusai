name: Release

# Triggered by pushing a semantic version tag: git tag v0.1.0 && git push --tags
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # create GitHub Release
  packages: write   # push to ghcr.io

jobs:
  # ── Run full CI first — don't publish a broken release ─────────────────────
  test:
    name: Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew build test --no-daemon

  # ── Native CLI binaries — 4 platforms ──────────────────────────────────────
  cli-native:
    name: CLI (${{ matrix.artifact }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: nocturnusai-linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact: nocturnusai-linux-arm64
          - runner: macos-latest      # Apple Silicon (M1/M2/M3)
            artifact: nocturnusai-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM with native-image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm"
          native-image-job-reports: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Inject version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^    version = \".*\"/    version = \"${VERSION}\"/" build.gradle.kts
          rm -f build.gradle.kts.bak
          echo "Set Gradle version to ${VERSION}"

      - name: Build native binary
        run: ./gradlew :nocturnusai-cli:nativeCompile -PnativeRelease --no-daemon
        env:
          # GraalVM CE build optimisation flag
          GRAALVM_HOME: ${{ env.GRAALVM_HOME }}

      - name: Rename binary
        run: |
          mv nocturnusai-cli/build/native/nativeCompile/nocturnusai ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Smoke test
        run: ./${{ matrix.artifact }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  # ── Docker: native multi-platform build (no QEMU emulation) ─────────────────
  # Each platform builds on its own native runner in parallel, then the digests
  # are merged into a single multi-arch manifest. This is ~3× faster than QEMU.
  docker-build:
    name: Docker (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Inject version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^    version = \".*\"/    version = \"${VERSION}\"/" build.gradle.kts
          rm -f build.gradle.kts.bak
          echo "Set Gradle version to ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the version string once, via env, so the Dockerfile's
      # ARG VERSION picks up the clean semver (no leading "v") and the
      # OCI image.version label matches the git tag.
      - name: Compute image version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "IMAGE_VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=ghcr.io/auctalis/nocturnusai,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Docker (merge manifests)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/auctalis/nocturnusai
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/auctalis/nocturnusai@sha256:%s ' *)

  # ── Python SDK → PyPI ───────────────────────────────────────────────────────
  python-sdk:
    name: Python SDK → PyPI
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" sdks/python/pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" sdks/python/nocturnusai/__init__.py
          echo "Set Python SDK version to ${VERSION}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: pip install hatch virtualenv==20.29.3

      - name: Build distribution
        working-directory: sdks/python
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
          password: ${{ secrets.PYPI_API_KEY }}

  # ── TypeScript SDK → npm ────────────────────────────────────────────────────
  typescript-sdk:
    name: TypeScript SDK → npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Inject version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd sdks/typescript
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          echo "Set TypeScript SDK version to ${VERSION}"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install and build
        working-directory: sdks/typescript
        run: npm ci && npm run build

      - name: Publish
        working-directory: sdks/typescript
        run: |
          output=$(npm publish --access public 2>&1) && echo "$output" || {
            echo "$output"
            if echo "$output" | grep -q "previously published versions"; then
              echo "Already published — skipping."
              exit 0
            fi
            if echo "$output" | grep -q "E404"; then
              echo "::error::npm returned 404. Check that NPM_TOKEN has 'Read and write' on 'All packages'."
            fi
            exit 1
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Note: Docs → GitHub Pages is handled by docs.yml on every push to main.
  # GitHub Pages environment protection rules prevent tag-triggered deployments,
  # so docs are NOT deployed here in the release workflow.

  # ── GitHub Release with CLI binaries + auto-generated notes ─────────────────
  github-release:
    name: GitHub Release
    needs: [cli-native, docker, python-sdk, typescript-sdk]
    # Proceed as long as Docker and SDK publishes succeeded.
    # CLI binaries are downloaded best-effort — missing platforms are OK.
    if: |
      always() &&
      needs.docker.result == 'success' &&
      needs.python-sdk.result == 'success' &&
      needs.typescript-sdk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for release notes

      - name: Download all CLI binaries
        uses: actions/download-artifact@v4
        continue-on-error: true   # OK if some platforms failed to build
        with:
          pattern: nocturnusai-*
          path: dist/

      - name: Make binaries executable
        run: find dist -name 'nocturnusai-*' -type f -exec chmod +x {} \; || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false   # OK if some platforms failed to build
          files: dist/nocturnusai-*/nocturnusai-*
          body: |
            ## Install

            **One-line install (server + CLI)**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Auctalis/nocturnusai/main/install.sh | bash
            ```

            **Docker (server only — connects to host Ollama by default)**
            ```bash
            docker run -p 9300:9300 ghcr.io/auctalis/nocturnusai:${{ github.ref_name }}
            ```

            **CLI only**
            ```bash
            # macOS (Apple Silicon)
            curl -fsSL https://github.com/Auctalis/nocturnusai/releases/download/${{ github.ref_name }}/nocturnusai-macos-arm64 -o /usr/local/bin/nocturnusai && chmod +x /usr/local/bin/nocturnusai

            # Linux (x86_64)
            curl -fsSL https://github.com/Auctalis/nocturnusai/releases/download/${{ github.ref_name }}/nocturnusai-linux-x86_64 -o /usr/local/bin/nocturnusai && chmod +x /usr/local/bin/nocturnusai
            ```

            **Python SDK**
            ```bash
            pip install nocturnusai==${{ github.ref_name }}
            ```

            **TypeScript / Node**
            ```bash
            npm install nocturnusai-sdk@${{ github.ref_name }}
            ```

            ---
            Full changelog and migration notes below ↓
