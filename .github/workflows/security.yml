name: Security

# Runs on every push to main, every PR, and weekly to catch newly-disclosed CVEs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC

permissions:
  contents: read
  security-events: write   # Required to upload SARIF → GitHub Security tab

jobs:
  # ── 1. Trivy: npm + secrets + misconfig ─────────────────────────────────────
  # Covers: npm lock files (sdks/typescript, site), Dockerfile, hardcoded secrets
  trivy:
    name: Trivy (npm / secrets / misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Full SARIF scan → GitHub Security tab
      - name: Scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Table output for the Actions log
      - name: Scan (table log)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          trivyignores: .trivyignore

      # Hard-fail on CRITICAL vulnerabilities
      - name: Fail on CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

  # ── 2. pip-audit: Python SDK dependencies ───────────────────────────────────
  # pip-audit queries PyPI advisory database (OSV, PyPI advisories)
  python-audit:
    name: pip-audit (Python SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core SDK + pip-audit
        working-directory: sdks/python
        # Audit production deps only — langchain/dev extras are not shipped with the SDK
        run: pip install -e "." pip-audit

      - name: Audit production dependencies
        working-directory: sdks/python
        run: pip-audit --desc on --format columns

  # ── 3. OWASP Dependency Check: Gradle / JVM dependencies ────────────────────
  # Scans resolved Gradle dependency tree against NVD CVE database
  gradle-owasp:
    name: OWASP (Gradle/JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Cache the NVD database (~200 MB) — avoid re-downloading on every run
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts') }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        run: ./gradlew dependencyCheckAnalyze --no-daemon

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: "**/build/reports/dependency-check-report.html"
          retention-days: 14

      - name: Fail on CVSS ≥ 7 (HIGH/CRITICAL)
        run: |
          if find . -name "dependency-check-report.xml" | xargs grep -l 'severity="HIGH"\|severity="CRITICAL"' 2>/dev/null; then
            echo "HIGH or CRITICAL vulnerabilities found — see uploaded report"
            exit 1
          fi
