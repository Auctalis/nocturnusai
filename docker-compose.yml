# ─────────────────────────────────────────────────────────────────────────────
# AxiomBase — Logic Server for Agentic AI
#
# Quick start:
#   cp .env.example .env        # configure provider & keys
#   docker compose up -d        # server only (bring your own LLM)
#   docker compose --profile ollama up -d   # server + local Ollama
#
# Shortcuts via Makefile:
#   make up                     # server only
#   make up-ollama              # server + Ollama sidecar
#   make down / make logs / make health
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── AxiomBase Logic Server ─────────────────────────────────────────────────
  axiombase:
    image: axiombase:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axiombase
    restart: unless-stopped
    ports:
      - "${PORT:-9300}:${PORT:-9300}"
      # - "${TLS_PORT:-9443}:${TLS_PORT:-9443}"  # Uncomment for TLS
    volumes:
      - axiombase-data:/data
    env_file:
      - path: .env
        required: false
    environment:
      # These are always set — .env overrides take precedence
      - PORT=${PORT:-9300}
      - HOST=0.0.0.0
      - STORAGE_DIR=/data
    networks:
      - axiombase-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${PORT:-9300}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      ollama:
        condition: service_started
        required: false

  # ── Ollama (local LLM — opt-in via profile) ───────────────────────────────
  # Activated with:  docker compose --profile ollama up -d
  # Or:  make up-ollama
  #
  # On first start, pulls the model (~2GB for llama3.2).
  # GPU passthrough: uncomment the deploy section below.
  ollama:
    image: ollama/ollama:latest
    container_name: axiombase-ollama
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - axiombase-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # ── GPU support (uncomment for NVIDIA) ──
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Ollama model bootstrap ────────────────────────────────────────────────
  # Pulls the configured model on first start, then exits.
  ollama-pull:
    image: curlimages/curl:latest
    container_name: axiombase-ollama-pull
    profiles:
      - ollama
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - axiombase-net
    restart: "no"
    entrypoint: >
      sh -c "curl -sf http://ollama:11434/api/pull -d '{\"name\": \"${LLM_MODEL:-llama3.2}\"}' && echo 'Model ready.'"

  # ── Monitoring Stack (opt-in via profile) ──────────────────────────────
  # Activated with:  docker compose --profile monitoring up -d
  # Or:  make up-monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: axiombase-prometheus
    profiles:
      - monitoring
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - axiombase-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=1GB'

  grafana:
    image: grafana/grafana:latest
    container_name: axiombase-grafana
    profiles:
      - monitoring
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-axiombase}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - axiombase-net
    depends_on:
      - prometheus

volumes:
  axiombase-data:
    driver: local
  ollama-models:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  axiombase-net:
    driver: bridge
