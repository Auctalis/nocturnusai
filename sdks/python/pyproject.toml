[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nocturnusai"
version = "0.3.5"
description = "Python SDK for NocturnusAI — a logic-based inference engine and knowledge database"
readme = "README.md"
license = {text = "Business Source License 1.1"}
requires-python = ">=3.10"
authors = [
    { name = "NocturnusAI Team" },
]
keywords = [
    "nocturnusai",
    "logic",
    "inference",
    "knowledge-base",
    "reasoning",
    "symbolic-ai",
    "agent-memory",
    "crewai",
    "autogen",
    "langgraph",
    "openai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.2.0,<1.0.0",
]
crewai = [
    "crewai>=0.80",
]
autogen = [
    "autogen-agentchat>=0.4",
]
langgraph = [
    "langgraph-checkpoint>=2.0",
]
openai-agents = [
    "openai-agents>=0.1",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.8",
]
all = [
    "nocturnusai[langchain]",
    "nocturnusai[crewai]",
    "nocturnusai[autogen]",
    "nocturnusai[langgraph]",
    "nocturnusai[openai-agents]",
]

[project.urls]
Homepage = "https://github.com/Auctalis/nocturnusai"
Documentation = "https://github.com/Auctalis/nocturnusai/tree/main/sdks/python"
Repository = "https://github.com/Auctalis/nocturnusai"
Issues = "https://github.com/Auctalis/nocturnusai/issues"

[tool.hatch.build]
# This package lives inside a larger monorepo; rely on explicit package selection
# instead of repo-root VCS ignore rules when building release artifacts.
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/examples",
    "/nocturnusai",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["nocturnusai"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
# JSON HTTP clients return Any from deserialization; disable at module level
warn_return_any = false

# Optional framework dependencies — not installed in CI base environment
[[tool.mypy.overrides]]
module = [
    "agents",
    "agents.*",
    "crewai",
    "crewai.*",
    "autogen_agentchat",
    "autogen_agentchat.*",
    "langgraph",
    "langgraph.*",
]
ignore_missing_imports = true

# crewai.tools.BaseTool resolves to Any without stubs — subclassing Any is fine here
[[tool.mypy.overrides]]
module = "nocturnusai.crewai"
disable_error_code = ["misc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
